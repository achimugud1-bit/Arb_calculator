name: Build ARBMASTER PRO Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name 'settings.gradle.kts' | head -n 1)")
          echo "Building Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          APK_PATH=$(find . -path "*/build/outputs/apk/debug/app-debug.apk" | head -n 1)
          mkdir -p apk-output
          cp "$APK_PATH" apk-output/ARBMASTER-PRO-debug.apk

      - name: Upload Installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ARBMASTER-PRO-Android-APK
          path: apk-output/ARBMASTER-PRO-debug.apk
          retention-days: 30
